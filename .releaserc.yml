  #      - { type: 'style',    section: '> Style' }
  #      - { type: 'test',     section: '> Tests' }

#-----------------------------------------------------------------------------

  # Plugin to create or update a changelog file.
  - path: '@semantic-release/changelog'
    changelogFile: 'CHANGELOG.md'        

