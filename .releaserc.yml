##############################################################################
# Options
# https://semantic-release.gitbook.io/semantic-release/usage/configuration#options

# Continuous Integration environment verifications. This allows making releases from a local machine.
ci: false 

# Output debugging information.
debug: true

# The objective of the dry-run mode is to get a preview of the pending release.
dryRun: false

##############################################################################
# Plugins
# https://semantic-release.gitbook.io/semantic-release/extending/plugins-list#official-plugins

plugins:

  # Plugin to analyze commits with conventional-changelog
  - path: '@semantic-release/commit-analyzer'
    preset: "conventionalcommits"
    releaseRules:
    - { breaking: true, release: major }
    - { type: build,    release: patch }
    - { type: chore,    release: false }
    - { type: ci,       release: false }
    - { type: dep,      release: patch }
    - { type: docs,     release: patch }
    - { type: feat,     release: minor }
    - { type: fix,      release: patch }
    - { type: perf,     release: patch }
    - { type: refactor, release: false }
    - { type: revert,   release: patch }
    - { type: style,    release: patch }
    - { type: test,     release: false }

#-----------------------------------------------------------------------------

