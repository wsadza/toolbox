[program:llama]
priority=20
command=/usr/bin/20_start_%(program_name)s.sh
# logging
stdout_logfile=%(ENV_XDG_RUNTIME_DIR)s/logs/log_%(program_name)s
stdout_logfile_maxbytes=50MB
stderr_logfile=%(ENV_XDG_RUNTIME_DIR)s/logs/log_%(program_name)s
stderr_logfile_maxbytes=50MB
# options
stopasgroup=true
stopsignal=INT
environment=
  AI_HOST="%(ENV_AI_HOST)s",
  AI_PORT="%(ENV_AI_PORT)s",
  LLAMA_CACHE="%(ENV_LLAMA_CACHE)s",
  LLAMA_ARG_MODEL="%(ENV_LLAMA_ARG_MODEL)s",
  LLAMA_ARG_CTX_SIZE="%(ENV_LLAMA_ARG_CTX_SIZE)s",
  LLAMA_ARG_N_GPU_LAYERS="%(ENV_LLAMA_ARG_N_GPU_LAYERS)s",
  LLAMA_ARG_HOST="%(ENV_LLAMA_ARG_HOST)s",
  LLAMA_ARG_PORT="%(ENV_LLAMA_ARG_PORT)s",
  LLAMA_ARG_ALIAS="%(ENV_LLAMA_ARG_ALIAS)s"
# start
autostart=true
autorestart=false
