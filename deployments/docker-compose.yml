services:

  # ==================================================
  # toolbox 
  # ==================================================

  toolbox:
    hostname:       toolbox 
    container_name: toolbox 
    image:          toolbox
    restart:        unless-stopped

    # =============================================================================
    # : Volumes
    # =============================================================================
    volumes:
      # Host home paths are identical inside toolbox.
      - /home:/home

      # Full host filesystem escape hatch.
      - /:/host

      # Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock

    # =============================================================================
    # : Network 
    # =============================================================================
    network_mode: host

    # Extra Hosts 
    extra_hosts:
      - "toolbox:127.0.1.1"

    # =============================================================================
    # : Extra Settings 
    # =============================================================================
    cap_add:
      - SYS_ADMIN

    security_opt:
      - apparmor:unconfined

    # =============================================================================
    # : Build 
    # =============================================================================
    build:
      dockerfile: "./Dockerfile"
      context:    "../build/"

      args:
        # -- Base
        DISTRIBUTION:           ${DISTRIBUTION}
        SUITE:                  ${SUITE}
        DIGEST:                 ${DIGEST}

        # -- Neovim
        INSTALL_NEOVIM:         ${INSTALL_NEOVIM}
        NEOVIM_VERSION:         ${NEOVIM_VERSION}

        # -- Docker
        INSTALL_DOCKER:         ${INSTALL_DOCKER}
        DOCKER_CE_VERSION:      ${DOCKER_CE_VERSION}
        DOCKER_CE_CLI_VERSION:  ${DOCKER_CE_CLI_VERSION}
        CONTAINERD_VERSION:     ${CONTAINERD_VERSION}
        DOCKER_BUILDX_VERSION:  ${DOCKER_BUILDX_VERSION}
        DOCKER_COMPOSE_VERSION: ${DOCKER_COMPOSE_VERSION}

        # -- K9s
        INSTALL_K9S:            ${INSTALL_K9S}
        K9S_VERSION:            ${K9S_VERSION}

        # -- Helm
        INSTALL_HELM:           ${INSTALL_HELM}
        HELM_VERSION:           ${HELM_VERSION}

        # -- Kubectl
        INSTALL_KUBECTL:        ${INSTALL_KUBECTL}
        KUBECTL_VERSION:        ${KUBECTL_VERSION}

        # -- Terraform
        INSTALL_TERRAFORM:      ${INSTALL_TERRAFORM}
        TERRAFORM_VERSION:      ${TERRAFORM_VERSION}

        # -- AzureCLI
        INSTALL_AZURE_CLI:      ${INSTALL_AZURE_CLI}
        AZURE_CLI_SUITE:        ${AZURE_CLI_SUITE}
        AZURE_CLI_VERSION:      ${AZURE_CLI_VERSION}

        # -- Node.js
        INSTALL_NODE_JS:        ${INSTALL_NODE_JS}
        NODE_JS_VERSION:        ${NODE_JS_VERSION}
        NODE_JS_MAJOR:          ${NODE_JS_MAJOR}

        # -- Gomplate
        INSTALL_GOMPLATE:       ${INSTALL_GOMPLATE}
        GOMPLATE_VERSION:       ${GOMPLATE_VERSION}

        # -- Extra packages (python; node; cargo)
        CARGO_TREE_SITTER_CLI:  ${CARGO_TREE_SITTER_CLI}
        NPM_NEOVIM:             ${NPM_NEOVIM}
        NPM_OPENCODE_AI:        ${NPM_OPENCODE_AI}
        PIPX_UV:                ${PIPX_UV}

        # -- Proxy 
        HTTP_PROXY:             ${HTTP_PROXY} 
        HTTPS_PROXY:            ${HTTPS_PROXY} 
        NO_PROXY:               ${NO_PROXY}

        # -- Github
        GITHUB_TOKEN:           ${GITHUB_TOKEN}

    # =============================================================================
    # : Environments 
    # =============================================================================
    environment:
        # -- Liqiudprompt
        LIQUIDPROMPT_THEME:     ${LIQUIDPROMPT_THEME}
